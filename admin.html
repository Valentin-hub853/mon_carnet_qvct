<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRACTIVE — Statistiques</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
body{margin:0;background:#F6F4EF;color:#173044;font-family:Inter,system-ui,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:30px 20px 60px}
h1{font-family:Georgia,serif;font-size:26px;color:#315E84;margin:0 0 6px}
p.sub{color:#6D7F8D;margin:0 0 24px}
.gate{background:#fff;border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(44,81,110,.10)}
input{width:100%;box-sizing:border-box;border:1px solid #D7E2E7;border-radius:11px;padding:12px;font-size:15px;margin:10px 0}
button{border:0;border-radius:999px;background:#4678A3;color:#fff;padding:13px 22px;font-weight:800;cursor:pointer;font-size:14px}
.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 10px 30px rgba(44,81,110,.10)}
.card h2{font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:#4678A3;margin:0 0 12px}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #E3E9EC;font-size:14px}
.row:last-child{border-bottom:none}
.row b{color:#173044}
.big{font-size:40px;font-family:Georgia,serif;color:#315E84;font-weight:700}
.err{color:#C95A4E;font-size:13px;margin-top:8px}
.hidden{display:none}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;border:1px solid #D7E2E7;border-radius:999px;background:#fff;color:#4678A3;padding:10px;font-weight:700;font-size:13px;cursor:pointer;text-align:center}
.tab.active{background:#4678A3;color:#fff;border-color:#4678A3}
.hero{background:linear-gradient(135deg,#4678A3,#315E84);color:#fff;border-radius:18px;padding:24px;margin-bottom:14px;text-align:center}
.hero .big{color:#fff;font-size:46px}
.hero p{margin:6px 0 0;opacity:.9;font-size:13px}
.pct-bar{background:#EEF2F5;border-radius:999px;height:10px;overflow:hidden;margin-top:6px}
.pct-fill{background:#4678A3;height:100%;border-radius:999px}
canvas{max-height:220px}
.stat-duo{display:flex;gap:12px}
.stat-duo>div{flex:1;background:#F6F9FA;border-radius:14px;padding:16px;text-align:center}
.stat-duo .big{font-size:30px}
.stat-duo p{margin:4px 0 0;color:#6D7F8D;font-size:12px}
</style></head><body><div class="wrap">
<h1>Statistiques SRACTIVE</h1>
<p class="sub">Vue agrégée et anonyme de l'usage du carnet — aucune réponse individuelle n'est affichée ici.</p>
<div class="gate" id="gate">
  <label>Clé d'accès</label>
  <input type="password" id="key" placeholder="Votre clé secrète">
  <button onclick="load()">Afficher les statistiques</button>
  <div class="err hidden" id="err"></div>
</div>
<div id="results" class="hidden"></div>
<script>
let fullData = null;
let period = '3d'; // '3d' ou 'all'
let charts = [];

// Libellés lisibles pour les codes bruts renvoyés par l'API.
const CHAPTER_LABELS = {
  sedentary: 'Casser la sédentarité',
  pain: 'Réduire les tensions et prévenir les TMS',
  nutrition: 'Construire une alimentation qui soutient l’énergie',
  stress: 'Réguler le stress et protéger son attention',
  training: 'Construire une routine d’entraînement',
  sleep: 'Le sommeil, votre meilleur temps de récupération',
};
const JOB_PROFILE_LABELS = {
  maintenance: 'Techniciens de maintenance',
  logistique: 'Magasiniers / Logisticiens',
  production: 'Techniciens de production',
  operateurs: 'Opérateurs (conditionnement, production)',
  qualite: 'Techniciens contrôle qualité / laboratoire',
  support: 'Fonctions supports / Postes administratifs',
  autre: 'Autre',
  inconnu: 'Non renseigné',
};
const JOB_BUCKET_LABELS = {
  bureau: 'Bureau',
  industriel: 'Industriel',
  mixte: 'Mixte',
  inconnu: 'Non renseigné',
};
const NEED_LABELS = {
  mouvement: 'Me remettre en mouvement',
  tensions: 'Relâcher des tensions',
  energie: 'Retrouver de l’énergie',
  stress: 'Mieux réguler mon stress',
  poste: 'Préparer ma prise de poste',
  inconnu: 'Non renseigné',
};
const SCREEN_LABELS = {
  cover: 'Écran d’accueil',
  intro: 'Mon profil (accueil)',
  toc: 'Sommaire des escales',
  chapter: 'Contenu d’une escale',
  generator: 'Générateur de besoin',
  myroutines: 'Mes routines',
  dashboard: 'Mon bilan',
  inconnu: 'Non renseigné',
};

function label(map, key){ return (map && map[key]) || key; }
function relabel(obj, map){
  const out = {};
  for(const [k,v] of Object.entries(obj || {})) out[label(map,k)] = v;
  return out;
}
function sortDesc(obj){
  return Object.entries(obj || {}).sort((a,b)=>b[1]-a[1]);
}

async function load(){
  const key = document.getElementById('key').value.trim();
  const errBox = document.getElementById('err');
  errBox.classList.add('hidden');
  if(!key){ return; }
  try{
    const res = await fetch('/api/v1/stats?key=' + encodeURIComponent(key));
    const data = await res.json();
    if(!data.ok){
      errBox.textContent = data.error === 'unauthorized' ? 'Clé incorrecte.' : ('Erreur : ' + data.error);
      errBox.classList.remove('hidden');
      return;
    }
    fullData = data;
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('results').classList.remove('hidden');
    renderPeriod();
  }catch(e){
    errBox.textContent = 'Impossible de contacter le serveur.';
    errBox.classList.remove('hidden');
  }
}
function pct(part, total){
  if(!total) return 0;
  return Math.round((part/total)*100);
}
function renderTable(title, obj){
  const entries = Object.entries(obj || {});
  if(!entries.length) return `<div class="card"><h2>${title}</h2><p style="color:#6D7F8D;font-size:13px;margin:0">Aucune donnée pour le moment.</p></div>`;
  return `<div class="card"><h2>${title}</h2>${entries.map(([k,v])=>`<div class="row"><span>${k}</span><b>${v}</b></div>`).join('')}</div>`;
}
function renderPercentBars(title, obj, suffix){
  const entries = Object.entries(obj || {});
  if(!entries.length) return `<div class="card"><h2>${title}</h2><p style="color:#6D7F8D;font-size:13px;margin:0">Aucune donnée pour le moment.</p></div>`;
  return `<div class="card"><h2>${title}</h2>${entries.map(([k,v])=>`
    <div style="margin-bottom:10px">
      <div class="row" style="border:none;padding:2px 0"><span>${k}</span><b>${v}${suffix||''}</b></div>
      <div class="pct-bar"><div class="pct-fill" style="width:${Math.min(v,100)}%"></div></div>
    </div>`).join('')}</div>`;
}
function destroyCharts(){
  charts.forEach(c => c.destroy());
  charts = [];
}
function renderPeriod(){
  const stats = period === '3d' ? fullData.last_3_days : fullData.all_time;
  const results = document.getElementById('results');
  destroyCharts();
  const viewsLabeled = relabel(stats.views, SCREEN_LABELS);
  const totalViews = Object.values(stats.views || {}).reduce((a,b)=>a+b,0);
  const viewsPercent = {};
  for(const [k,v] of Object.entries(viewsLabeled)) viewsPercent[k] = pct(v, totalViews);

  const chaptersValidated = Object.values(stats.chapters_completed || {}).reduce((a,b)=>a+b,0);
  const needsSorted = sortDesc(stats.needs_requested);
  const challengesByChapterLabeled = relabel(stats.challenges_by_chapter, CHAPTER_LABELS);
  const chaptersOpenedLabeled = relabel(stats.chapters_opened, CHAPTER_LABELS);
  const chaptersCompletedLabeled = relabel(stats.chapters_completed, CHAPTER_LABELS);
  const completionRateLabeled = relabel(stats.completion_rate_by_chapter, CHAPTER_LABELS);
  const quizAverageLabeled = relabel(stats.quiz_average_percent, CHAPTER_LABELS);
  const jobBucketLabeled = relabel(stats.job_bucket, JOB_BUCKET_LABELS);
  const jobProfileLabeled = relabel(stats.job_profile, JOB_PROFILE_LABELS);

  results.innerHTML = `
    <div class="tabs">
      <div class="tab ${period==='3d'?'active':''}" onclick="setPeriod('3d')">3 derniers jours</div>
      <div class="tab ${period==='all'?'active':''}" onclick="setPeriod('all')">Historique complet</div>
    </div>
    <div class="hero">
      <div class="big">${stats.unique_sessions}</div>
      <p>Volume total d'utilisateurs (appareils uniques, un appareil ≈ une personne) ${period==='3d' ? 'ayant utilisé l’application sur les 3 derniers jours' : 'depuis le lancement'}</p>
    </div>
    <div class="card">
      <h2>Vue d'ensemble</h2>
      <p style="color:#6D7F8D;font-size:12px;margin:-4px 0 12px">Totaux généraux. Le détail escale par escale est présenté plus bas.</p>
      <div class="row"><span>Circuits sportifs lancés (générateur de séances)</span><b>${stats.circuits_started}</b></div>
      <div class="row"><span>Total des escales validées</span><b>${chaptersValidated}</b></div>
      <div class="row"><span>Total des défis relevés</span><b>${stats.challenges_completed || 0}</b></div>
    </div>
    <div class="card">
      <h2>Utilisateurs par outil connecté (graphique)</h2>
      <canvas id="chartSites"></canvas>
    </div>
    ${renderTable('Utilisateurs par outil connecté (détail)', stats.unique_sessions_by_site)}
    <div class="card">
      <h2>Répartition des métiers (graphique)</h2>
      <canvas id="chartJobBucket"></canvas>
    </div>
    ${renderTable('Répartition des métiers (détail)', jobProfileLabeled)}
    <div class="card">
      <h2>Écrans consultés (graphique)</h2>
      <canvas id="chartViews"></canvas>
    </div>
    ${renderPercentBars('Écrans consultés (en % des vues)', viewsPercent, '%')}
    ${renderPercentBars('Taux de complétion par escale', completionRateLabeled, '%')}
    ${renderTable('Escales ouvertes', chaptersOpenedLabeled)}
    ${renderTable('Escales terminées', chaptersCompletedLabeled)}
    ${renderPercentBars('Score moyen aux quiz par escale', quizAverageLabeled, '%')}
    ${renderTable('Défis relevés par escale', challengesByChapterLabeled)}
    <div class="card">
      <h2>Besoins les plus demandés (graphique)</h2>
      <canvas id="chartNeeds"></canvas>
    </div>
    ${renderTable('Besoins les plus demandés (détail)', Object.fromEntries(needsSorted.map(([k,v])=>[label(NEED_LABELS,k),v])))}
    <div class="card">
      <h2>Temps passé sur l'application</h2>
      <div class="stat-duo">
        <div><div class="big">${stats.avg_daily_minutes || 0}</div><p>Minutes en moyenne par jour d'utilisation</p></div>
        <div><div class="big">${stats.avg_session_minutes || 0}</div><p>Minutes en moyenne par session</p></div>
      </div>
    </div>
    <div class="card">
      <p style="color:#6D7F8D;font-size:12px;margin:0 0 12px">Indicateur technique : ${stats.total_events} actions ont été enregistrées au total sur la période (utile uniquement pour vérifier que les données remontent bien).</p>
      <button onclick="resetStats()" style="background:#C95A4E">Réinitialiser les statistiques</button>
      <p style="color:#6D7F8D;font-size:12px;margin:10px 0 0">Supprime définitivement tous les événements enregistrés. Utile pour repartir de zéro avant une vraie mise en production.</p>
      <div class="err hidden" id="resetErr"></div>
    </div>
  `;
  const viewsEntries = Object.entries(viewsLabeled);
  if(viewsEntries.length){
    charts.push(new Chart(document.getElementById('chartViews'), {
      type: 'bar',
      data: {
        labels: viewsEntries.map(e=>e[0]),
        datasets: [{ label: 'Vues', data: viewsEntries.map(e=>e[1]), backgroundColor: '#4678A3', borderRadius: 6 }]
      },
      options: { plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,ticks:{precision:0}}} }
    }));
  }
  const siteEntries = Object.entries(stats.unique_sessions_by_site || {});
  if(siteEntries.length){
    charts.push(new Chart(document.getElementById('chartSites'), {
      type: 'doughnut',
      data: {
        labels: siteEntries.map(e=>e[0]),
        datasets: [{ data: siteEntries.map(e=>e[1]), backgroundColor: ['#4678A3','#6D7F8D','#315E84','#C95A4E','#9BB8CE'] }]
      },
      options: { plugins:{legend:{position:'bottom'}} }
    }));
  }
  const jobBucketEntries = Object.entries(jobBucketLabeled);
  if(jobBucketEntries.length){
    charts.push(new Chart(document.getElementById('chartJobBucket'), {
      type: 'doughnut',
      data: {
        labels: jobBucketEntries.map(e=>e[0]),
        datasets: [{ data: jobBucketEntries.map(e=>e[1]), backgroundColor: ['#4678A3','#C95A4E','#9BB8CE','#6D7F8D'] }]
      },
      options: { plugins:{legend:{position:'bottom'}} }
    }));
  }
  const needsEntries = needsSorted.map(([k,v])=>[label(NEED_LABELS,k),v]);
  if(needsEntries.length){
    charts.push(new Chart(document.getElementById('chartNeeds'), {
      type: 'bar',
      data: {
        labels: needsEntries.map(e=>e[0]),
        datasets: [{ label: 'Demandes', data: needsEntries.map(e=>e[1]), backgroundColor: '#315E84', borderRadius: 6 }]
      },
      options: { indexAxis: 'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true,ticks:{precision:0}}} }
    }));
  }
}
function setPeriod(p){
  period = p;
  renderPeriod();
}
async function resetStats(){
  if(!confirm('Cette action supprime définitivement toutes les statistiques enregistrées, sans possibilité de les récupérer. Continuer ?')) return;
  const key = document.getElementById('key').value.trim();
  const errBox = document.getElementById('resetErr');
  errBox.classList.add('hidden');
  try{
    const res = await fetch('/api/v1/reset?key=' + encodeURIComponent(key), { method: 'POST' });
    const data = await res.json();
    if(!data.ok){
      errBox.textContent = data.error === 'unauthorized' ? 'Clé incorrecte.' : ('Erreur : ' + data.error);
      errBox.classList.remove('hidden');
      return;
    }
    alert(data.deleted + ' événement(s) supprimé(s).');
    load();
  }catch(e){
    errBox.textContent = 'Impossible de contacter le serveur.';
    errBox.classList.remove('hidden');
  }
}
</script>
</div></body></html>
